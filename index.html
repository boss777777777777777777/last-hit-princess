<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6fafb">
  <meta name="description" content="3つのステージを駆け抜け、最後に待つピーチ姫に挑む横スクロールアクション。パソコン・スマホで遊べます。">
  <title>あと一撃のプリンセス | ブラウザアクション</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="arcade">
    <header class="page-header">
      <a class="brand" href="./" aria-label="あと一撃のプリンセス ホーム"><span class="brand-crown" aria-hidden="true">♛</span><span>あと一撃のプリンセス<small>THE LAST HIT PRINCESS</small></span></a>
      <div class="header-actions"><button id="sound" class="icon-button" aria-pressed="false" aria-label="音をオンにする">♪ <span>音 OFF</span></button><button id="fullscreen" class="icon-button" aria-label="全画面で遊ぶ">⛶ <span>全画面</span></button></div>
    </header>
    <div class="game-heading"><span class="eyebrow">ちいさな冒険。てごわすぎる姫。</span><span class="ready"><i></i>ブラウザですぐにプレイ</span></div>
    <section class="cabinet" aria-label="横スクロールアクションゲーム">
      <div class="hud"><div class="hud-world"><span id="stage-label">WORLD 01</span><strong id="stage-name">はじまりの草原</strong></div><div class="hud-stats"><span class="health" id="health" aria-label="残り体力3">♥ ♥ ♥</span><span class="coin-stat"><i aria-hidden="true">◆</i><span id="coins">00</span></span><button id="pause" class="pause" aria-label="一時停止" disabled>Ⅱ</button></div></div>
      <div class="playfield" id="playfield">
        <canvas id="game" width="960" height="540" tabindex="0" aria-label="ゲーム画面。左右キーで移動、スペースでジャンプ、Xで攻撃。"></canvas>
        <div class="boss-hud" id="boss-hud" hidden><div><span>ピーチ姫</span><span id="boss-label">12 / 12</span></div><div class="boss-track"><div id="boss-health"></div></div></div>
        <div class="scene-toast" id="toast" aria-live="polite"></div>
        <div class="overlay" id="overlay"><div class="start-panel" id="panel"><span class="panel-kicker">A LITTLE PIXEL ADVENTURE</span><h1>あと一撃の<br><em>プリンセス</em></h1><p>走って、跳んで、星を放て。<br>3つの世界の先に、ピーチ姫が待っている。</p><button class="primary" id="start">冒険をはじめる <span>PLAY</span></button><span class="start-hint">SPACE キーでもスタート</span></div></div>
        <div class="end-flash" id="end-flash"></div>
      </div>
      <div class="progress-row"><span id="progress-text">STAGE 1 / 3</span><div class="progress-track"><div id="progress"></div></div><span id="progress-percent">0%</span></div>
    </section>
    <div class="touch-controls" aria-label="タッチ操作"><div class="dpad"><button data-control="left" aria-label="左に移動">◀</button><button data-control="right" aria-label="右に移動">▶</button></div><div class="actionpad"><button data-control="attack" class="attack" aria-label="星で攻撃">✦<small>攻撃</small></button><button data-control="jump" class="jump" aria-label="ジャンプ">↑<small>ジャンプ</small></button></div></div>
    <div class="below-game"><div class="keyboard-guide"><span class="guide-label">操作</span><span><kbd>←</kbd><kbd>→</kbd> 移動</span><span><kbd>SPACE</kbd> ジャンプ</span><span><kbd>X</kbd> 星で攻撃</span><span><kbd>ESC</kbd> 一時停止</span></div><button id="restart" class="text-button">↻ 最初から</button></div>
    <nav class="stage-map" aria-label="ステージ選択"><button data-stage="0" class="stage active"><span class="stage-number">01</span><span><strong>はじまりの草原</strong><small>GREEN MEADOW</small></span><span class="stage-status">PLAY</span></button><button data-stage="1" class="stage" disabled><span class="stage-number">02</span><span><strong>星空の渡り道</strong><small>STARRY CROSSING</small></span><span class="stage-status">LOCKED</span></button><button data-stage="2" class="stage" disabled><span class="stage-number">03</span><span><strong>ピーチ姫の城</strong><small>THE ROYAL FINALE</small></span><span class="stage-status">LOCKED</span></button></nav>
    <footer><span>3 STAGES · ONE VERY TOUGH PRINCESS</span><span>非公式ファンゲーム / オリジナルのドット絵・効果音</span></footer>
    <noscript>このゲームを遊ぶには、ブラウザのJavaScriptを有効にしてください。</noscript>
  </main>
  <script src="sprites.js"></script>
  <script src="engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
